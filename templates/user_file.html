<!DOCTYPE html>
<html>
<head>
    <title>Review Time</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px 40px;
            width: 380px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 24px;
        }

        label {
            font-weight: bold;
            display: block;
            text-align: left;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.2s;
        }

        select:focus, textarea:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.4);
        }

        button {
            margin-top: 20px;
            padding: 10px 15px;
            width: 100%;
            font-size: 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #2980b9;
            transform: scale(1.02);
        }

        #msg {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>
</head>
<body>

<h2>Submit Your Review</h2>

<form id="reviewForm">
    <label>Rating:</label>
    <select name="rating" required>
        <option value="">Select</option>
        <option value="1"> 1</option>
        <option value="2"> 2</option>
        <option value="3"> 3</option>
        <option value="4"> 4</option>
        <option value="5"> 5</option>
    </select>

    <br><br>

    <label>Review:</label><br>
    <textarea name="review" rows="5" required></textarea>

    <br><br>
    <button type="submit">Submit</button>
</form>

<br>
<div id="msg" style="font-weight:bold; color:green;"></div>

<script>
document.getElementById("reviewForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const formData = new FormData(this);

    fetch("/submit", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("msg").innerHTML = "Thank you! Your review was submitted.";
        
        // Clear form
        document.getElementById("reviewForm").reset();
    })
    .catch(err => {
        document.getElementById("msg").innerHTML = "Error submitting review.";
    });
});
</script>

</body>
</html>
