<table id="submissionsTable">
   <thead>
      <tr>
         <th>Rating</th>
         <th>Review</th>
         <th>AI Summary</th>
         <th>Recommended Action</th>
      </tr>
   </thead>
   <tbody id="tableBody"></tbody>
</table>

<script>
async function loadSubmissions() {
   try {
      const res = await fetch("/submissions");  
      const data = await res.json();

      updateTable(data);
   } catch (err) {
      console.error("Error loading submissions:", err);
   }
}

function updateTable(data){
   const tableBody = document.getElementById("tableBody");
   tableBody.innerHTML = "";

   data.forEach(item => {
      const row = document.createElement("tr");

      row.innerHTML = `
         <td>${item.rating}</td>
         <td style="max-width:250px; white-space:pre-wrap;">${item.review}</td>
         <td style="max-width:250px; white-space:pre-wrap;">${item.summary}</td>
         <td><ul style="padding-left:18px; margin:0;">${actionHTML}</ul></td>
      `;

      tableBody.appendChild(row);
   });
}
setInterval(loadSubmissions, 3000)
</script>
